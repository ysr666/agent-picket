name: DSH Offline Published Host Goal Probe

on:
  pull_request:
    paths:
      - 'scripts/verify-dsh-official-host-goal.mjs'
      - 'tests/fixtures/dsh-official-persistence-goal-host.mjs'
      - '.github/workflows/dsh-official-host-goal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-host:
    name: ${{ matrix.os }} / Node24 / real SDK Host offline
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install official DSH CLI into isolated folder
        run: >
          npm install --prefix .dsh-host-probe --no-save --no-package-lock
          --no-audit --no-fund @deepseek-ai/dsh@0.2.0-rc.2
      - name: Verify official DSH profile, persisted completed work and actual Goal pre-step block
        run: node scripts/verify-dsh-official-host-goal.mjs
