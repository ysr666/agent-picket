name: DSH Published Provider Cold Read

on:
  pull_request:
    paths:
      - 'scripts/verify-dsh-official-native-provider.mjs'
      - '.github/workflows/dsh-published-provider.yml'
      - 'tests/evidence/DSH_PUBLISHED_JSONL_NATIVE_PROBE_20261014.zh.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published-provider:
    name: \${{ matrix.os }} / Node \${{ matrix.node }}
    runs-on: \${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22.19.0'
          - os: ubuntu-latest
            node: '24'
          - os: macos-latest
            node: '24'
          - os: windows-latest
            node: '24'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: \${{ matrix.node }}
      - name: Install official published provider in isolated test directory
        run: >
          npm install --prefix .dsh-provider-probe --no-save --no-package-lock
          --no-audit --no-fund
          @deepseek-ai/dsh-session@0.2.0-rc.2
          @deepseek-ai/dsh-session-persistence@0.2.0-rc.2
          @deepseek-ai/dsh-session-persistence-jsonl@0.2.0-rc.2
      - name: Verify actual provider cold-read after closing original process
        run: node scripts/verify-dsh-official-native-provider.mjs
