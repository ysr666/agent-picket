name: DSH Real Web First-Run UI and Host Consent

on:
  pull_request:
    paths:
      - '.github/workflows/dsh-web-first-run-real.yml'
      - 'tests/dsh-goal-welcome.real.test.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-first-run-real:
    name: Published DSH Web / Chrome / official installed Picket
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build official candidate with package contracts intact
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
      - name: Install isolated official DSH and headless Chrome driver
        run: |
          npm install -g pnpm@11.7.0 --no-audit --no-fund
          npm install --prefix .dsh-web-host --no-save --no-package-lock --no-audit --no-fund @deepseek-ai/dsh@0.2.0-rc.2
          npm install --prefix .dsh-web-browser --no-save --no-package-lock --no-audit --no-fund playwright-core@1.58.2
      - name: Locate native browser from GitHub Runner
        shell: bash
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            exe="$(command -v google-chrome)"
          elif command -v chromium >/dev/null 2>&1; then
            exe="$(command -v chromium)"
          elif command -v chromium-browser >/dev/null 2>&1; then
            exe="$(command -v chromium-browser)"
          else
            echo "No system Chrome found. Real browser test cannot be falsely skipped." >&2
            exit 1
          fi
          echo "AGENT_PICKET_CHROME_BIN=$exe" >> "$GITHUB_ENV"
          "$exe" --version
      - name: Real browser clicks explicit Goal authorization and reads Host CAS
        env:
          PICKET_GOAL_WELCOME_E2E: '1'
          PICKET_GOAL_EXIT_E2E: '1'
          AGENT_PICKET_DSH_BIN: ${{ github.workspace }}/.dsh-web-host/node_modules/.bin/dsh
          AGENT_PICKET_DSH_HOST: ${{ github.workspace }}/.dsh-web-host/node_modules
          AGENT_PICKET_PLAYWRIGHT_ENTRY: ${{ github.workspace }}/.dsh-web-browser/node_modules/playwright-core/index.mjs
        run: >
          node --experimental-strip-types --test --test-reporter=tap
          --test-name-pattern="real DSH Web: one informed first-run click"
          tests/dsh-goal-welcome.real.test.ts
