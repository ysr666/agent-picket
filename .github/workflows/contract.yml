name: Core and package contracts

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - '.github/workflows/contract.yml'
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-picket-contract-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: ${{ matrix.os }} / Node ${{ matrix.node }} / ${{ matrix.scope }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22.19.0'
            scope: full
          - os: ubuntu-latest
            node: '24'
            scope: full
          - os: macos-latest
            node: '24'
            scope: full
          - os: windows-latest
            node: '24'
            scope: portable-only-durable-ledger-NO-GO
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install pinned dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Full unit contracts (Unix private-storage permission backend)
        if: runner.os != 'Windows'
        run: npm test
      - name: Portable unit contracts (Windows ledger remains fail-closed)
        if: runner.os == 'Windows'
        run: node scripts/run-windows-portable-tests.mjs
      - name: Verify package contents without publishing
        run: node scripts/check-package-budget.mjs
      # An automatic reviewer artifact, NOT npm publish, tag or release.
      - name: Build SHA-pinned UNRELEASED QA package
        if: runner.os == 'Linux' && matrix.node == '24'
        shell: bash
        run: |
          mkdir -p qa-unreleased
          npm pack --ignore-scripts --pack-destination qa-unreleased --silent
          (
            cd qa-unreleased
            sha256sum agent-picket-0.0.0.tgz > SHA256SUMS
            printf 'AGENT PICKET DEVELOPMENT QA ONLY - NOT RELEASED\n' > READ_FIRST.txt
            printf 'Source commit: %s\n' "$GITHUB_SHA" >> READ_FIRST.txt
            printf 'Draft development candidate; real input strike OFF.\n' >> READ_FIRST.txt
            printf 'Install ONLY to an isolated disposable DSH profile.\n' >> READ_FIRST.txt
            printf 'No npm publication, tag or maintainer release approval.\n' >> READ_FIRST.txt
          )
          node --input-type=module -e 'import {statSync} from "node:fs"; if(statSync("qa-unreleased/agent-picket-0.0.0.tgz").size>250000)throw Error("QA tarball too large")'
      - name: Upload UNRELEASED QA package and SHA256
        if: runner.os == 'Linux' && matrix.node == '24'
        uses: actions/upload-artifact@v4
        with:
          name: agent-picket-unreleased-qa-${{ github.sha }}
          path: qa-unreleased/
          if-no-files-found: error
          retention-days: 7
