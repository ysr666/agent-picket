name: Core and package contracts

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - '.github/workflows/contract.yml'
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-picket-contract-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: ${{ matrix.os }} / Node ${{ matrix.node }} / ${{ matrix.scope }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22.19.0'
            scope: full
          - os: ubuntu-latest
            node: '24'
            scope: full
          - os: macos-latest
            node: '24'
            scope: full
          - os: windows-latest
            node: '24'
            scope: portable-only-durable-ledger-NO-GO
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install pinned dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Full unit contracts (Unix private-storage permission backend)
        if: runner.os != 'Windows'
        run: npm test
      - name: Portable unit contracts (Windows ledger remains fail-closed)
        if: runner.os == 'Windows'
        run: node scripts/run-windows-portable-tests.mjs
      - name: Verify package contents without publishing
        run: node scripts/check-package-budget.mjs
